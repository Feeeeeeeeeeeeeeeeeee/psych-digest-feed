name: Daily Psychology Research Digest

on:
  schedule:
    # 09:00 UTC = 22:00 (10:00 PM) NZDT every night
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai edge-tts requests pillow

      - name: Run Daily Morning Digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_digest.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add episodes/ feed.xml
          # Add paper_history.json if present
          if [ -f paper_history.json ]; then
            git add paper_history.json
          fi
          git diff --quiet && git diff --staged --quiet || (git commit -m "Drop daily morning research briefing [skip ci]" && git push)
