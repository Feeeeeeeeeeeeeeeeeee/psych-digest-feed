name: Bi-Weekly Psychology Digest

on:
  schedule:
    # 5:00 AM Monday NZDT (16:00 UTC Sunday) & 5:00 AM Thursday NZDT (16:00 UTC Wednesday)
    - cron: '0 16 * * 0,3'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system fonts and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          pip install requests edge-tts pillow google-genai

      - name: Run Digest Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_digest.py

      - name: Commit and Push Updated Feed, Artwork, and History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add episodes/ artwork/ feed.xml history.json
          if git diff --staged --quiet; then
            echo "No new episodes to commit."
          else
            git commit -m "Automated digest release: $(date +'%Y-%m-%d')"
            git push origin main
          fi
