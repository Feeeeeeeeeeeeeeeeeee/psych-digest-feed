name: Generate Single Article On-Demand

on:
  workflow_dispatch:

jobs:
  build-single:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system fonts and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          pip install requests edge-tts pillow google-genai

      - name: Run Single Episode Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_single.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add episodes/ artwork/ feed.xml history.json
          git commit -m "On-demand spotlight episode: $(date +'%Y-%m-%d %H:%M')"
          git push origin main
